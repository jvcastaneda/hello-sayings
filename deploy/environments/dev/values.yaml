# Values for the dev environment (minikube). Argo CD applies these on top of the
# chart defaults; change them with a PR.

dynamodb:
  # Created by infra/envs/dev
  table: hello-sayings-dev

aws:
  region: us-west-1
  # Created by scripts/rotate-app-key.sh, never committed
  existingSecret: hello-sayings-aws

metrics:
  serviceMonitor:
    enabled: true
    labels:
      release: prometheus
  dashboard:
    enabled: true
  slo:
    # Prometheus here keeps 10d on an emptyDir, so a 30d budget can't be measured.
    # Raise retention and add a persistent volume before lengthening this.
    window: 7d
