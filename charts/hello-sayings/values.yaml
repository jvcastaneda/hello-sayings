replicaCount: 1

image:
  repository: ghcr.io/jvcastaneda/hello-sayings
  pullPolicy: IfNotPresent
  # Defaults to the chart appVersion
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Annotation-based scrape config for Prometheus setups that use it
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/path: /metrics
  prometheus.io/port: "3000"
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 80

containerPort: 3000

# Storage. With no table set, the app uses its in-memory store (dev only)
dynamodb:
  table: ""
  # Override for DynamoDB Local, e.g. http://dynamodb-local:8000
  endpoint: ""

aws:
  region: ""
  # Secret holding AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY, created outside
  # the chart (scripts/rotate-app-key.sh). Leave empty when credentials come from
  # elsewhere, e.g. IRSA / EKS Pod Identity via serviceAccount annotations.
  existingSecret: ""

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: hello-sayings.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

metrics:
  serviceMonitor:
    # Requires the Prometheus Operator CRDs. Its labels must match your Prometheus
    # serviceMonitorSelector (kube-prometheus-stack: release: <its release name>)
    enabled: false
    interval: 15s
    labels: {}
  dashboard:
    # ConfigMap for the Grafana dashboard sidecar
    enabled: false
    labels:
      grafana_dashboard: "1"
  prometheusRule:
    # Alerting rules; skipped automatically if the Prometheus Operator CRDs are not
    # installed. Its labels must match your Prometheus ruleSelector
    # (kube-prometheus-stack: release: <its release name>)
    enabled: true
    labels:
      release: prometheus
    clientErrorRatio: 0.25
  # SLIs, SLOs, and error budget burn-rate alerts (see SLO.md). Rendered into
  # their own PrometheusRule, which uses the prometheusRule labels above.
  slo:
    enabled: true
    # Error budget period. Must not exceed Prometheus retention.
    window: 30d
    availability:
      # Share of requests (excluding probes and scrapes) that don't return 5xx
      objective: 0.995
    latency:
      # Share of requests (excluding probes and scrapes) served within thresholdSeconds
      objective: 0.98
      # Must be one of the app's histogram buckets: 0.001 0.005 0.01 0.025 0.05 0.1 0.25 0.5 1
      thresholdSeconds: 0.25
    # Multi-window, multi-burn-rate alerts (Google SRE workbook, "Alerting on SLOs").
    # Fires when the error ratio exceeds burnRate x the budget over both windows: the
    # long window proves it's significant, the short one that it's still happening.
    burnRateAlerts:
      - { severity: critical, longWindow: 1h, shortWindow: 5m, burnRate: 14.4, for: 2m }
      - { severity: critical, longWindow: 6h, shortWindow: 30m, burnRate: 6, for: 2m }
      - { severity: warning, longWindow: 1d, shortWindow: 2h, burnRate: 3, for: 5m }
      - { severity: warning, longWindow: 3d, shortWindow: 6h, burnRate: 1, for: 5m }

nodeSelector: {}
tolerations: []
affinity: {}
