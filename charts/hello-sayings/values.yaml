replicaCount: 1

image:
  repository: ghcr.io/jvcastaneda/hello-sayings
  pullPolicy: IfNotPresent
  # Defaults to the chart appVersion
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Annotation-based scrape config for Prometheus setups that use it
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/path: /metrics
  prometheus.io/port: "3000"
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 80

containerPort: 3000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: hello-sayings.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

metrics:
  serviceMonitor:
    # Requires the Prometheus Operator CRDs. Its labels must match your Prometheus
    # serviceMonitorSelector (kube-prometheus-stack: release: <its release name>)
    enabled: false
    interval: 15s
    labels: {}
  dashboard:
    # ConfigMap for the Grafana dashboard sidecar
    enabled: false
    labels:
      grafana_dashboard: "1"

nodeSelector: {}
tolerations: []
affinity: {}
