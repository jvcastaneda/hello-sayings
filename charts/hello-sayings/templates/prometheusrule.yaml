{{- if and .Values.metrics.prometheusRule.enabled (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1/PrometheusRule") -}}
{{- $sel := printf "namespace=%q, service=%q" .Release.Namespace (include "hello-sayings.fullname" .) -}}
{{- $rules := .Values.metrics.prometheusRule -}}
# Only rendered when the Prometheus Operator CRDs are installed. Its labels must
# match your Prometheus ruleSelector (kube-prometheus-stack: release: <its release name>)
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "hello-sayings.fullname" . }}
  labels:
    {{- include "hello-sayings.labels" . | nindent 4 }}
    {{- with $rules.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: hello-sayings
      # Error rates and latency are covered by the SLO burn-rate alerts
      # (prometheusrule-slo.yaml); these catch what SLOs don't
      rules:
        # absent() also fires when every pod is gone (e.g. scaled to 0)
        - alert: HelloSayingsDown
          expr: absent(up{ {{- $sel -}} } == 1)
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "hello-sayings has no healthy scrape targets"
            description: "Prometheus has not successfully scraped {{ include "hello-sayings.fullname" . }} in {{ .Release.Namespace }} for 1 minute."


        - alert: HelloSayingsHighClientErrorRate
          expr: |
            sum(rate(http_requests_total{ {{- $sel -}}, status=~"4.."}[2m]))
              / sum(rate(http_requests_total{ {{- $sel -}} }[2m])) > {{ $rules.clientErrorRatio }}
          for: 3m
          labels:
            severity: warning
          annotations:
            summary: "hello-sayings 4xx ratio is high"
            description: "{{`{{ $value | humanizePercentage }}`}} of requests are 4xx (threshold {{ $rules.clientErrorRatio }}). Clients may be sending bad requests."


        # Catches crashes and OOM kills; needs kube-state-metrics
        - alert: HelloSayingsRestarting
          expr: increase(kube_pod_container_status_restarts_total{namespace={{ .Release.Namespace | quote }}, container={{ .Chart.Name | quote }}}[10m]) > 0
          labels:
            severity: warning
          annotations:
            summary: "hello-sayings container restarted"
            description: "Pod {{`{{ $labels.pod }}`}} restarted in the last 10 minutes (crash or OOM kill)."
{{- end }}
