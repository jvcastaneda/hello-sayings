name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    services:
      # Lets the DynamoDB store tests run against a real DynamoDB API
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports:
          - 8000:8000
    env:
      DYNAMODB_ENDPOINT: http://localhost:8000
      AWS_REGION: us-west-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint charts/hello-sayings
      - name: Render with defaults
        run: helm template test charts/hello-sayings > /dev/null
      # As Argo CD renders it for dev, with the Prometheus Operator CRDs present
      - name: Render dev environment
        run: |
          helm template hello-sayings charts/hello-sayings \
            -f deploy/environments/dev/values.yaml \
            --api-versions monitoring.coreos.com/v1/PrometheusRule \
            --api-versions monitoring.coreos.com/v1/ServiceMonitor > /dev/null

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
