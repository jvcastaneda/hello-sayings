name: Release

# Push a tag like v0.1.0 to publish:
#   - image: ghcr.io/<owner>/hello-sayings:<version>
#   - chart: oci://ghcr.io/<owner>/charts/hello-sayings --version <version>
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute names
        run: |
          echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/hello-sayings:${{ env.VERSION }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/hello-sayings:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  chart:
    runs-on: ubuntu-latest
    needs: image
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Compute names
        run: |
          echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Lint
        run: helm lint charts/hello-sayings

      - name: Package
        run: |
          helm package charts/hello-sayings \
            --version "$VERSION" \
            --app-version "$VERSION" \
            --destination dist

      - name: Push to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
          helm push dist/hello-sayings-"$VERSION".tgz "oci://$REGISTRY/$OWNER/charts"
