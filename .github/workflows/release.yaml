name: Release

# Push a tag like v0.1.0 to publish:
#   - image: ghcr.io/<owner>/hello-sayings:<version>
#   - chart: oci://ghcr.io/<owner>/charts/hello-sayings --version <version>
#   - a PR bumping the dev Argo CD app to that version (merge it to deploy)
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute names
        run: |
          echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/hello-sayings:${{ env.VERSION }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/hello-sayings:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  chart:
    runs-on: ubuntu-latest
    needs: image
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Compute names
        run: |
          echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Lint
        run: helm lint charts/hello-sayings

      - name: Package
        run: |
          helm package charts/hello-sayings \
            --version "$VERSION" \
            --app-version "$VERSION" \
            --destination dist

      - name: Push to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
          helm push dist/hello-sayings-"$VERSION".tgz "oci://$REGISTRY/$OWNER/charts"

  # GitOps: deploying is a reviewed PR, never a push from CI
  promote-dev:
    runs-on: ubuntu-latest
    needs: chart
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Bump dev to the new chart version
        run: |
          # Exported so yq's strenv() can read it in this step
          export VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          yq -i '(.spec.sources[] | select(.chart == "hello-sayings")).targetRevision = strenv(VERSION)' \
            deploy/argocd/apps/hello-sayings-dev.yaml
          # Fail rather than open a PR that deploys the wrong version
          grep -q "targetRevision: $VERSION$" deploy/argocd/apps/hello-sayings-dev.yaml
          git diff

      # Needs "Allow GitHub Actions to create and approve pull requests" in repo settings.
      # PRs opened with the default GITHUB_TOKEN don't trigger CI, so required checks
      # never report; set a DEPLOY_PR_TOKEN secret (fine-grained PAT: contents and
      # pull requests read/write on this repo) to get checks on deploy PRs.
      - uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.DEPLOY_PR_TOKEN || github.token }}
          branch: deploy/dev-${{ env.VERSION }}
          commit-message: "Deploy ${{ env.VERSION }} to dev"
          title: "Deploy ${{ env.VERSION }} to dev"
          body: |
            Points the dev Argo CD application at chart/image `${{ env.VERSION }}`.
            Argo CD syncs it once this is merged.
          labels: deploy
